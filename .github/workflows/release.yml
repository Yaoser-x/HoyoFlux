# Release pipeline (plan §28): a v-tag triggers build + test + package +
# SHA256 + GitHub release artifact. The version string itself comes from the
# CMake single source (HOYOFLUX_PRERELEASE must be cleared for a final).

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build, test and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install llvm-mingw toolchain
        run: |
          $tag = (Get-Content .github/llvm-mingw-version.txt -Raw).Trim()
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$tag/llvm-mingw-$tag-ucrt-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile llvm-mingw.zip
          Expand-Archive -Path llvm-mingw.zip -DestinationPath C:\tools
          "C:\tools\llvm-mingw-$tag-ucrt-x86_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure (release)
        run: cmake --preset release

      - name: Build (release)
        run: cmake --build --preset release

      - name: Test (release)
        run: ctest --preset release --output-on-failure -j 1

      - name: Verify configuration-driven launch contract
        shell: pwsh
        run: |
          & .\build\release\tests\app_test.exe '[app][config]'
          if ($LASTEXITCODE -ne 0) { throw 'configuration-driven launch contract failed' }

      - name: Verify release-audit failure cases
        shell: pwsh
        run: |
          & .\tools\release_audit.ps1 -Exe .\build\release\src\app\hoyoflux.exe -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'release audit self-test failed' }

      - name: Verify configured version matches tag
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          $versionHeader = Get-Content .\build\release\generated\version.hpp -Raw
          $match = [regex]::Match(
            $versionHeader,
            '(?m)^#define HOYOFLUX_VERSION_STRING "([^"]*)"\s*$'
          )
          if (-not $match.Success) {
            throw 'generated version header does not contain HOYOFLUX_VERSION_STRING'
          }
          $configuredVersion = $match.Groups[1].Value
          if ($tagVersion -ne $configuredVersion) {
            throw "tag version '$tagVersion' does not match configured version '$configuredVersion'"
          }

      - name: Package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $packageDirectory = 'dist/package-audit'
          & .\tools\release_audit.ps1 -Exe .\build\release\src\app\hoyoflux.exe -PackageDirectory $packageDirectory
          if ($LASTEXITCODE -ne 0) { throw 'release artifact audit failed' }

          $exeAsset = "dist/hoyoflux-$version-windows-x64.exe"
          Copy-Item -LiteralPath .\build\release\src\app\hoyoflux.exe -Destination $exeAsset
          $exeHash = (Get-FileHash $exeAsset -Algorithm SHA256).Hash
          "$exeHash  $(Split-Path $exeAsset -Leaf)" | Set-Content -Encoding ascii "dist/SHA256SUMS.txt"

      - name: Release contents smoke
        shell: pwsh
        run: |
          $packageDirectory = 'dist/package-audit'
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $exeAsset = "dist/hoyoflux-$version-windows-x64.exe"
          $executables = @(Get-ChildItem $packageDirectory -Recurse -File -Filter *.exe)
          if ($executables.Count -ne 1 -or $executables[0].Name -ne 'hoyoflux.exe') {
            throw 'audited package contents must contain exactly one hoyoflux.exe'
          }
          if (@(Get-ChildItem $packageDirectory -Recurse -File -Filter *.dll).Count -ne 0) {
            throw 'audited package contents must not contain runtime DLLs'
          }
          if (Test-Path (Join-Path $packageDirectory 'config.toml')) {
            throw 'release contents must not include a user config.toml'
          }
          foreach ($required in @('README.md', 'CHANGELOG.md', 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'config.example.toml', 'docs/compatibility-matrix.md', 'docs/persistent-state-experiment.md', 'assets/hoyoflux.ico')) {
            if (-not (Test-Path (Join-Path $packageDirectory $required))) { throw "audited package contents are missing $required" }
          }
          $standaloneHash = (Get-FileHash $exeAsset -Algorithm SHA256).Hash
          $auditedHash = (Get-FileHash $executables[0].FullName -Algorithm SHA256).Hash
          if ($standaloneHash -ne $auditedHash) {
            throw 'standalone release EXE differs from the audited build'
          }
          $checksumLines = @(Get-Content -LiteralPath 'dist/SHA256SUMS.txt')
          $expectedChecksumLine = "$standaloneHash  $(Split-Path $exeAsset -Leaf)"
          if ($checksumLines.Count -ne 1 -or $checksumLines[0] -ne $expectedChecksumLine) {
            throw 'SHA256SUMS.txt must contain the exact standalone EXE hash'
          }

      - name: Clean-package executable smoke
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $exe = "dist/hoyoflux-$version-windows-x64.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw 'standalone release EXE is missing' }
          $expectedVersion = $env:GITHUB_REF_NAME.Substring(1)
          & .\tools\executable_smoke.ps1 -Exe $exe -ExpectedVersion $expectedVersion

      - name: Publish release
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $releaseArgs = @(
            'release', 'create', $env:GITHUB_REF_NAME,
            "dist/hoyoflux-$version-windows-x64.exe",
            "dist/SHA256SUMS.txt",
            '--title', "HoyoFlux $version", '--generate-notes'
          )
          if ($version -match '-(?:alpha|beta|rc)(?:\.|$)') {
            $releaseArgs += '--prerelease'
          }
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
        env:
          GH_TOKEN: ${{ github.token }}
