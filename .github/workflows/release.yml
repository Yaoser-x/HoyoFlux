# Release pipeline (plan §28): a v-tag triggers build + test + package +
# SHA256 + GitHub release artifact. The version string itself comes from the
# CMake single source (HOYOFLUX_PRERELEASE must be cleared for a final).

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build, test and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install llvm-mingw toolchain
        run: |
          $tag = (Get-Content .github/llvm-mingw-version.txt -Raw).Trim()
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$tag/llvm-mingw-$tag-ucrt-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile llvm-mingw.zip
          Expand-Archive -Path llvm-mingw.zip -DestinationPath C:\tools
          "C:\tools\llvm-mingw-$tag-ucrt-x86_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure (release)
        run: cmake --preset release

      - name: Build (release)
        run: cmake --build --preset release

      - name: Test (release)
        run: ctest --preset release --output-on-failure -j 1

      - name: Verify configuration-driven launch contract
        shell: pwsh
        run: |
          & .\build\release\tests\app_test.exe '[app][config]'
          if ($LASTEXITCODE -ne 0) { throw 'configuration-driven launch contract failed' }

      - name: Verify release-audit failure cases
        shell: pwsh
        run: |
          & .\tools\release_audit.ps1 -Exe .\build\release\src\app\hoyoflux.exe -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'release audit self-test failed' }

      - name: Verify configured version matches tag
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          $versionHeader = Get-Content .\build\release\generated\version.hpp -Raw
          $match = [regex]::Match(
            $versionHeader,
            '(?m)^#define HOYOFLUX_VERSION_STRING "([^"]*)"\s*$'
          )
          if (-not $match.Success) {
            throw 'generated version header does not contain HOYOFLUX_VERSION_STRING'
          }
          $configuredVersion = $match.Groups[1].Value
          if ($tagVersion -ne $configuredVersion) {
            throw "tag version '$tagVersion' does not match configured version '$configuredVersion'"
          }

      - name: Package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          & .\tools\release_audit.ps1 -Exe .\build\release\src\app\hoyoflux.exe -PackageDirectory dist
          if ($LASTEXITCODE -ne 0) { throw 'release artifact audit failed' }

          Compress-Archive -Path dist/* -DestinationPath "dist/hoyoflux-$version-windows-x64.zip"
          $zipHash = (Get-FileHash "dist/hoyoflux-$version-windows-x64.zip" -Algorithm SHA256).Hash
          "$zipHash  hoyoflux-$version-windows-x64.zip" | Add-Content -Encoding ascii "dist/SHA256SUMS.txt"

      - name: Clean-package smoke
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'hoyoflux-clean-package'
          if (Test-Path $smoke) { Remove-Item -Recurse -Force $smoke }
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          Expand-Archive -Path "dist/hoyoflux-$($env:GITHUB_REF_NAME.Substring(1))-windows-x64.zip" -DestinationPath $smoke
          $executables = @(Get-ChildItem $smoke -Recurse -File -Filter *.exe)
          if ($executables.Count -ne 1 -or $executables[0].Name -ne 'hoyoflux.exe') {
            throw 'package must contain exactly one hoyoflux.exe'
          }
          if (@(Get-ChildItem $smoke -Recurse -File -Filter *.dll).Count -ne 0) {
            throw 'portable package must not contain runtime DLLs'
          }
          if (Test-Path (Join-Path $smoke 'config.toml')) {
            throw 'package must allow the EXE to create first-run config.toml'
          }
          foreach ($required in @('README.md', 'CHANGELOG.md', 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'config.example.toml', 'docs/compatibility-matrix.md', 'docs/persistent-state-experiment.md', 'assets/hoyoflux.ico')) {
            if (-not (Test-Path (Join-Path $smoke $required))) { throw "package is missing $required" }
          }

      - name: Clean-package executable smoke
        shell: pwsh
        run: |
          # SAFER's normal-user token needs a location writable inside the runner user's profile.
          $smoke = Join-Path $env:LOCALAPPDATA 'Temp\hoyoflux-exe-smoke-中文 路径'
          if (Test-Path $smoke) { Remove-Item -Recurse -Force $smoke }
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          Expand-Archive -Path "dist/hoyoflux-$($env:GITHUB_REF_NAME.Substring(1))-windows-x64.zip" -DestinationPath $smoke
          $exe = Join-Path $smoke 'hoyoflux.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'release ZIP does not contain hoyoflux.exe at its root' }
          $legacy = Join-Path $env:LOCALAPPDATA 'HoyoFlux'
          if (Test-Path $legacy) { throw 'clean runner unexpectedly already contains legacy HoyoFlux AppData' }
          $oldPath = $env:PATH
          $runnerIsAdministrator = [Security.Principal.WindowsPrincipal]::new(
            [Security.Principal.WindowsIdentity]::GetCurrent()
          ).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Output "Smoke runner is in Administrators group: $runnerIsAdministrator"
          function Start-SmokeExecutable([string]$path) {
            if ($runnerIsAdministrator) {
              # Product startup intentionally rejects an administrator token.
              # Hosted Windows runners use one, so test the same binary through
              # Windows SAFER's normal-user token without weakening that guard.
              $runAs = Join-Path $env:SystemRoot 'System32/runas.exe'
              $arguments = @('/trustlevel:0x20000', "`"$path`"")
              return Start-Process -FilePath $runAs -ArgumentList $arguments `
                -WorkingDirectory $env:RUNNER_TEMP -PassThru -Wait
            }
            return Start-Process -FilePath $path -WorkingDirectory $env:RUNNER_TEMP `
              -PassThru -Wait
          }
          try {
            $env:PATH = "$env:SystemRoot\System32"
            $firstRun = Start-SmokeExecutable $exe
            $configPath = Join-Path $smoke 'config.toml'
            for ($attempt = 0; $attempt -lt 15 -and -not (Test-Path $configPath); $attempt++) {
              Start-Sleep -Seconds 1
            }
            if (-not (Test-Path $configPath)) {
              $firstRunReport = Join-Path $smoke 'data/diagnostics.txt'
              $details = if (Test-Path $firstRunReport) {
                Get-Content -LiteralPath $firstRunReport -Raw
              } else {
                'No first-run diagnostic report was written.'
              }
              throw "first EXE launch did not create config.toml (runner administrator=$runnerIsAdministrator, exit code=$($firstRun.ExitCode)): $details"
            }
            $config = Get-Content (Join-Path $smoke 'config.toml') -Raw
            $config = $config -replace 'action = "launch"', 'action = "diagnose"'
            Set-Content -LiteralPath (Join-Path $smoke 'config.toml') -Value $config -Encoding utf8
            $reportPath = Join-Path $smoke 'data/diagnostics.txt'
            $null = Remove-Item -LiteralPath $reportPath -Force -ErrorAction SilentlyContinue
            $diagnoseRun = Start-SmokeExecutable $exe
            for ($attempt = 0; $attempt -lt 15 -and -not (Test-Path $reportPath); $attempt++) {
              Start-Sleep -Seconds 1
            }
            if (-not (Test-Path $reportPath)) {
              throw "diagnose EXE launch did not write diagnostics.txt (runner administrator=$runnerIsAdministrator, exit code=$($diagnoseRun.ExitCode))"
            }
            $report = Get-Content -LiteralPath $reportPath -Raw
            $expectedVersion = $env:GITHUB_REF_NAME.Substring(1)
            if ($report -notmatch [regex]::Escape("HoyoFlux 诊断报告 $expectedVersion")) {
              throw "diagnostic report version does not match $expectedVersion"
            }
            if (Test-Path $legacy) { throw 'EXE launch created AppData state' }
          } finally {
            $env:PATH = $oldPath
          }

      - name: Publish release
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $releaseArgs = @(
            'release', 'create', $env:GITHUB_REF_NAME,
            "dist/hoyoflux-$version-windows-x64.zip",
            "dist/SHA256SUMS.txt",
            '--title', "HoyoFlux $version", '--generate-notes'
          )
          if ($version -match '-(?:alpha|beta|rc)(?:\.|$)') {
            $releaseArgs += '--prerelease'
          }
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
        env:
          GH_TOKEN: ${{ github.token }}
