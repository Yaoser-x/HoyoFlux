# CI (plan F16). clang/MinGW is the supported toolchain and must stay green;
# MSVC is experimental until it is officially supported - do not pretend
# both are first-class.

name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  mingw-clang:
    name: Windows / clang (MinGW-w64 UCRT)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install llvm-mingw toolchain
        run: |
          $tag = "20250521"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$tag/llvm-mingw-$tag-ucrt-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile llvm-mingw.zip
          Expand-Archive -Path llvm-mingw.zip -DestinationPath C:\tools
          "C:\tools\llvm-mingw-$tag-ucrt-windows-x86_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure (debug)
        run: cmake --preset debug

      - name: Build (debug)
        run: cmake --build --preset debug

      - name: Test (debug)
        run: ctest --preset debug

      - name: Configure (release)
        run: cmake --preset release

      - name: Build (release)
        run: cmake --build --preset release

      - name: Test (release)
        run: ctest --preset release

  msvc-experimental:
    name: Windows / MSVC (experimental)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build/msvc -G "Visual Studio 17 2022" -A x64 `
            -DHOYOFLUX_BUILD_TESTS=ON -DHOYOFLUX_BUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build/msvc --config Debug

      - name: Test
        run: ctest --test-dir build/msvc -C Debug --output-on-failure
