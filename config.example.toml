# HoyoFlux 便携配置示例
schema = 2

[launcher]
game = "genshin"       # genshin | starrail
profile = "auto"       # 自动匹配；也可以填写配置档名称
action = "launch"      # launch | diagnose
# region = "auto"      # auto | cn | global
# notifications = true

[profiles.desktop]
game = "genshin"
fps = 120

[profiles.starrail_desktop]
game = "starrail"
fps = 120

# 可选：为每个游戏指定 Auto 无匹配时的回退配置档。
# [defaults]
# genshin = "desktop"
# starrail = "starrail_desktop"

# 可选移动端配置档。match 内填写任一条件便会参与自动匹配。
# [profiles.example_mobile]
# game = "genshin"
# fps = 60
# resolution = "1920x1080"   # 游戏渲染分辨率
# mobile_ui = true
# dpi_scale = 2.0
# power_save = true
# power_save_fps = 30
# hotkeys = true
# match = { resolution = "1920x1080", priority = 100 }

# 可选高级项（均放在对应配置档内）：
# fullscreen = "windowed"    # exclusive | borderless | windowed
# persistence = "session"    # session | persistent
# monitor = 0
# priority = "normal"        # realtime | high | above_normal | normal | below_normal
# exe = "Games/Genshin Impact game/GenshinImpact.exe"
# args = ["-popupwindow"]
